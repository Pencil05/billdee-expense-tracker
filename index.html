<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f2">
  <meta name="description" content="สรุปบิลล์ แก้ไขชื่อและยอดได้ทันที พร้อมกราฟที่อัปเดตตามรายการ">
  <title>สรุปบิลล์</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #242d36;
      --muted: #78818a;
      --paper: #fff;
      --canvas: #f7f5f2;
      --line: #e9e5df;
      --accent: #d44769;
      --accent-soft: #fff0f3;
      --font: "TH Sarabun IT๙", "TH Sarabun IT9", "TH Sarabun New", "TH Sarabun PSK", "Sarabun", Tahoma, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 20px; }
    main { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 50px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 25px; }
    h1 { margin: 0; font-size: 38px; line-height: 1.25; letter-spacing: -.04em; }
    .pdf-button { flex: none; border: 0; border-radius: 10px; background: var(--accent); color: #fff; padding: 10px 16px; font: inherit; font-size: 19px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px #d4476928; }
    .pdf-button:hover { background: #bd3557; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(350px, .92fr); gap: 20px; align-items: stretch; }
    .panel { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 9px 28px #29313b08; }
    .ledger { padding: 18px; }
    .chart-panel { padding: 20px 22px; display: flex; flex-direction: column; align-items: center; }
    h2 { align-self: flex-start; margin: 1px 0 17px; font-size: 24px; font-weight: 700; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    col:first-child { width: 67%; }
    col:last-child { width: 33%; }
    th { padding: 0 10px 11px; border-bottom: 1px solid var(--line); color: var(--muted); text-align: left; font-size: 18px; font-weight: 600; }
    th:last-child { text-align: right; }
    td { padding: 6px 7px; border-bottom: 1px solid #f0eeeb; }
    tbody tr:last-of-type td { border-bottom: 1px solid #f0eeeb; }
    .edit-field { width: 100%; min-width: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink); font: inherit; font-size: 22px; padding: 7px 8px; outline: 0; transition: background .15s, border-color .15s, box-shadow .15s; }
    .edit-field:hover { background: #faf9f7; }
    .edit-field:focus { background: #fff; border-color: #efb7c4; box-shadow: 0 0 0 3px #d4476916; }
    .price { text-align: right; font-variant-numeric: tabular-nums; }
    .name-wrap { display: flex; align-items: center; gap: 7px; }
    .name-wrap .edit-field { flex: 1; }
    .color-picker-wrap { position: relative; flex: none; }
    .color-button { width: 24px; height: 24px; padding: 0; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #0002; cursor: pointer; }
    .color-tray { position: absolute; z-index: 5; top: 31px; left: 0; display: grid; grid-template-columns: repeat(7, 26px); gap: 6px; width: 230px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fff; box-shadow: 0 8px 24px #18233322; }
    .color-tray[hidden] { display: none; }
    .swatch { width: 24px; height: 24px; padding: 0; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 0 1px #0002; cursor: pointer; }
    .swatch.selected { outline: 2px solid var(--ink); outline-offset: 2px; }
    .delete-button { width: 30px; height: 30px; flex: none; border: 0; border-radius: 8px; background: transparent; color: #a34a5d; font-size: 22px; line-height: 1; cursor: pointer; }
    .delete-button:hover { background: #fff0f3; }
    .add-row td { padding: 12px 4px 9px; border-bottom: 1px solid var(--line); }
    .add-actions { display: flex; align-items: center; gap: 8px; }
    .add-button { flex: 1; width: 100%; border: 1px dashed #e7a4b3; border-radius: 10px; background: #fffafb; color: var(--accent); padding: 10px; font: inherit; font-size: 19px; font-weight: 700; cursor: pointer; transition: background .15s, border-color .15s; }
    .add-button:hover { background: var(--accent-soft); border-color: var(--accent); }
    .plus { display: inline-grid; width: 18px; height: 18px; margin-right: 5px; place-items: center; border-radius: 50%; background: var(--accent); color: #fff; font-size: 16px; line-height: 1; vertical-align: -2px; }
    .image-add-button { display: grid; width: 42px; height: 42px; flex: none; place-items: center; border: 1px solid #eadfe2; border-radius: 10px; background: #fff; color: var(--accent); cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
    .image-add-button:hover { background: var(--accent-soft); border-color: #e7a4b3; transform: translateY(-1px); }
    .image-add-button svg { width: 21px; height: 21px; }
    .image-input { display: none; }
    dialog { width: min(680px, calc(100% - 28px)); max-height: min(90vh, 820px); padding: 0; border: 1px solid var(--line); border-radius: 18px; color: var(--ink); box-shadow: 0 24px 80px #11182740; font: inherit; }
    dialog::backdrop { background: #18212dcc; backdrop-filter: blur(3px); }
    .receipt-dialog { padding: 22px; }
    .receipt-dialog h2 { margin: 0 0 4px; font-size: 25px; }
    .receipt-help { margin: 0 0 16px; color: var(--muted); font-size: 17px; }
    .receipt-preview { display: grid; min-height: 170px; max-height: 320px; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: #f8f7f5; }
    .receipt-preview img { display: block; max-width: 100%; max-height: 320px; object-fit: contain; }
    .ocr-status { min-height: 28px; margin: 10px 0 12px; color: #596572; font-size: 16px; }
    .ocr-status[data-error="true"] { color: #a02d4a; }
    .receipt-fields { display: grid; grid-template-columns: 1fr 180px; gap: 12px; }
    .receipt-fields label { display: grid; gap: 5px; color: var(--muted); font-size: 16px; }
    .receipt-fields input { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; color: var(--ink); font: inherit; font-size: 20px; outline: 0; }
    .receipt-fields input:focus { border-color: #efb7c4; box-shadow: 0 0 0 3px #d4476916; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 18px; }
    .dialog-actions button { border: 0; border-radius: 9px; padding: 9px 15px; font: inherit; font-size: 18px; cursor: pointer; }
    .cancel-button { background: #f0efed; color: var(--ink); }
    .save-receipt-button { background: var(--accent); color: #fff; font-weight: 700; }
    .save-receipt-button:hover { background: #bd3557; }
    tfoot td { padding: 15px 10px 3px; border: 0; font-weight: 700; font-size: 21px; }
    tfoot td:last-child { text-align: right; color: var(--accent); font-size: 25px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .chart-title { align-self: flex-start; }
    .donut-wrap { width: min(100%, 360px); aspect-ratio: 1; position: relative; display: grid; place-items: center; margin: 1px auto 5px; }
    #donut { width: 100%; height: 100%; overflow: visible; }
    .slice { cursor: pointer; transition: opacity .16s, filter .16s; outline: none; }
    .slice:hover, .slice:focus { filter: brightness(1.07); }
    .chart-center { position: absolute; width: 49%; text-align: center; pointer-events: none; }
    .center-label { color: var(--muted); font-size: 18px; line-height: 1.4; }
    .center-value { margin-top: 4px; font-size: clamp(22px, 3vw, 32px); font-weight: 750; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
    .legend { display: grid; width: min(100%, 480px); grid-template-columns: 1fr 1fr; gap: 1px 14px; margin-top: 2px; }
    .legend-item { display: grid; grid-template-columns: 9px minmax(0,1fr) auto; align-items: center; gap: 7px; min-width: 0; border-radius: 8px; padding: 7px 6px; transition: background .15s, opacity .15s; }
    .legend-item.active, .legend-item:hover { background: #f8f6f3; }
    .legend-dot { width: 9px; height: 9px; border-radius: 3px; }
    .legend-name { overflow: hidden; color: #4c5660; font-size: 17px; text-overflow: ellipsis; white-space: nowrap; }
    .legend-amount { color: var(--ink); font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .storage-note { margin: 14px 0 0; color: var(--muted); font-size: 16px; text-align: center; }
    .empty-chart { fill: none; stroke: #eeece8; stroke-width: 28; }
    @media (max-width: 780px) {
      main { width: min(620px, calc(100% - 28px)); padding-top: 25px; }
      header { margin-bottom: 18px; }
      h1 { font-size: 33px; }
      .layout { grid-template-columns: 1fr; gap: 14px; }
      .ledger { padding: 12px; }
      .chart-panel { padding: 18px 15px; }
      .donut-wrap { width: min(88vw, 330px); }
      .receipt-dialog { padding: 16px; }
    }
    @media (max-width: 420px) {
      main { width: calc(100% - 20px); }
      .legend { grid-template-columns: 1fr; }
      col:first-child { width: 62%; }
      col:last-child { width: 38%; }
      .edit-field { font-size: 19px; padding: 8px 5px; }
      .name-wrap { gap: 5px; }
      .color-button { width: 21px; height: 21px; }
      .delete-button { width: 25px; font-size: 20px; }
      .color-tray { grid-template-columns: repeat(6, 26px); width: 194px; }
      tfoot td:last-child { font-size: 22px; }
      .receipt-fields { grid-template-columns: 1fr; }
    }
    @media print {
      @page { size: A4; margin: 14mm; }
      body { background: #fff; font-size: 15pt; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      main { width: 100%; max-width: none; padding: 0; }
      header { margin-bottom: 10mm; }
      h1 { font-size: 27pt; }
      .pdf-button, .add-row, .delete-button, dialog { display: none !important; }
      .layout { grid-template-columns: 1.1fr .9fr; gap: 8mm; }
      .panel { box-shadow: none; border-color: #ddd; break-inside: avoid; }
      .ledger, .chart-panel { padding: 5mm; }
      .edit-field { border: 0 !important; box-shadow: none !important; background: transparent !important; padding: 2mm 1mm; font-size: 15pt; }
      .color-button { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .color-tray { display: none !important; }
      .donut-wrap { width: 72mm; }
      .legend { grid-template-columns: 1fr; }
      .storage-note { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header><h1>สรุปบิลล์</h1><button class="pdf-button" id="pdfButton" type="button">บันทึก PDF</button></header>
    <section class="layout" aria-label="ตารางรายการและกราฟสรุปบิลล์">
      <section class="panel ledger" aria-label="ตารางบิลล์">
        <table>
          <colgroup><col><col></colgroup>
          <thead><tr><th scope="col">รายการ</th><th scope="col">ราคา (บาท)</th></tr></thead>
          <tbody id="billRows"></tbody>
          <tfoot>
            <tr class="add-row"><td colspan="2"><div class="add-actions"><button class="add-button" id="addButton" type="button"><span class="plus" aria-hidden="true">+</span>เพิ่มรายการ</button><button class="image-add-button" id="imageAddButton" type="button" title="เพิ่มรายการจากภาพบิล" aria-label="เพิ่มรายการจากภาพบิล"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="9" r="1.6" fill="currentColor"/><path d="m5 17 4.4-4.4a1.6 1.6 0 0 1 2.3 0l1.3 1.3 1.2-1.2a1.6 1.6 0 0 1 2.3 0L20 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><input class="image-input" id="receiptImage" type="file" accept="image/*" aria-label="เลือกรูปภาพบิล"></div></td></tr>
            <tr class="total-row"><td>ยอดรวม</td><td id="grandTotal">฿0</td></tr>
          </tfoot>
        </table>
      </section>
      <section class="panel chart-panel" aria-label="กราฟสรุปยอด">
        <h2 class="chart-title">กราฟสรุป</h2>
        <div class="donut-wrap">
          <svg id="donut" viewBox="0 0 320 320" role="img" aria-label="กราฟวงแหวนสรุปยอดตามรายการ"></svg>
          <div class="chart-center" aria-live="polite">
            <div class="center-label" id="centerLabel">ยอดรวม</div>
            <div class="center-value" id="centerValue">฿0</div>
          </div>
        </div>
        <div class="legend" id="legend" aria-label="รายละเอียดในกราฟ"></div>
        <p class="storage-note">บันทึกอัตโนมัติในเบราว์เซอร์นี้</p>
      </section>
    </section>
  </main>
  <dialog id="receiptDialog" aria-labelledby="receiptDialogTitle">
    <form class="receipt-dialog" id="receiptForm">
      <h2 id="receiptDialogTitle">เพิ่มรายการจากภาพบิล</h2>
      <p class="receipt-help">ระบบจะช่วยอ่านข้อความจากภาพ ตรวจสอบและแก้ชื่อหรือยอดก่อนบันทึกได้</p>
      <div class="receipt-preview"><img id="receiptPreview" alt="ตัวอย่างภาพบิลที่เลือก"></div>
      <p class="ocr-status" id="ocrStatus" role="status" aria-live="polite">กำลังเตรียมภาพ…</p>
      <div class="receipt-fields">
        <label>ชื่อรายการ<input id="receiptName" type="text" autocomplete="off" placeholder="เช่น ค่าอาหาร"></label>
        <label>ยอดเงิน (บาท)<input id="receiptAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></label>
      </div>
      <div class="dialog-actions"><button class="cancel-button" id="cancelReceipt" type="button">ยกเลิก</button><button class="save-receipt-button" type="submit">เพิ่มรายการ</button></div>
    </form>
  </dialog>
  <script>
    (() => {
      const KEY = 'billdee_simple_v1';
      const colors = ['#d44769','#e79048','#5e8e7b','#6b8ec2','#a06eaa','#86a84f','#d36d59','#5fa6ab','#b08b53','#7b8292','#c4779c','#ef6c8f','#3f7cac','#f0a202','#6a994e','#9b5de5','#00a896','#f15bb5','#577590','#f9844a','#90be6d','#277da1','#f3722c','#43aa8b','#f94144','#7b2cbf','#4895ef','#b08968','#52b788','#e76f51','#4361ee','#bc6c25','#2a9d8f','#d00000','#7209b7','#4d908e','#f8961e','#577399','#b56576','#386641'];
      const defaults = [
        ['ค่าเหล้าตะวันแดง',4200], ['ค่าเด็ก',3000], ['ปลั๊กไฟรุ่น',1400],
        ['รีเจนซี่',3600], ['ค่าเด็ก',7500], ['โอนให้บุคคล',2000],
        ['ค่ากับข้าว',4300], ['โอนให้บุคคล',4355], ['ค่าเหล้า',2000],
        ['ค่าเหล้า',11700], ['ค่าน้ำแข็ง',280],
        ['ค่าเด็ก ก ตวด',1500], ['ค่าเด็ก ตวด',1500], ['ค่าเด็ก ตวด',1500]
      ].map(([name, amount], i) => ({ id: i < 11 ? `start-${i}` : `receipt-${15859728 + i - 11}`, name, amount }));
      const addedBills = [
        { id: 'receipt-15859728', name: 'ค่าเด็ก ก ตวด', amount: 1500 },
        { id: 'receipt-15859729', name: 'ค่าเด็ก ตวด', amount: 1500 },
        { id: 'receipt-15859730', name: 'ค่าเด็ก ตวด', amount: 1500 }
      ];
      const seedMarker = 'billdee_seed_receipts_20261120_v1';
      const $ = id => document.getElementById(id);
      const money = n => Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
      const safeAmount = value => {
        const n = Number(value);
        return Number.isFinite(n) && n > 0 ? n : 0;
      };
      let bills = loadBills();

      function randomColor(used = new Set()) {
        const taken = new Set([...used].map(color => String(color).toLowerCase()));
        const available = colors.filter(color => !taken.has(color.toLowerCase()));
        if (available.length) return available[Math.floor(Math.random() * available.length)];
        for (let tries = 0; tries < 720; tries++) {
          const color = `hsl(${Math.floor(Math.random() * 360)} ${55 + Math.floor(Math.random() * 31)}% ${42 + Math.floor(Math.random() * 20)}%)`;
          if (!taken.has(color.toLowerCase())) { colors.push(color); return color; }
        }
        return `hsl(${Date.now() % 360} 70% 50%)`;
      }
      function normalize(list) {
        if (!Array.isArray(list)) return null;
        const used = new Set();
        return list.map((item, i) => {
          const savedColor = typeof item?.color === 'string' && item.color ? item.color : '';
          const color = savedColor && !used.has(savedColor.toLowerCase()) ? savedColor : randomColor(used);
          used.add(color.toLowerCase());
          return {
            id: String(item?.id ?? `bill-${Date.now()}-${i}`),
            name: String(item?.name ?? ''),
            amount: safeAmount(item?.amount),
            color
          };
        });
      }
      function loadBills() {
        try {
          const saved = localStorage.getItem(KEY);
          if (saved !== null) return addNewReceiptDefaults(normalize(JSON.parse(saved)) ?? []);
          // Keep any entries already saved by the previous version on this browser.
          const previous = localStorage.getItem('billdee_v1');
          if (previous !== null) {
            const migrated = normalize(JSON.parse(previous));
            if (migrated?.length) return addNewReceiptDefaults(migrated);
          }
        } catch (_) {}
        return normalize(defaults) ?? [];
      }
      function addNewReceiptDefaults(list) {
        if (localStorage.getItem(seedMarker)) return list;
        const ids = new Set(list.map(item => item.id));
        const used = new Set(list.map(item => item.color));
        for (const receipt of addedBills) {
          if (!ids.has(receipt.id)) {
            list.push({ ...receipt, color: randomColor(used) });
            used.add(list[list.length - 1].color);
          }
        }
        try { localStorage.setItem(seedMarker, '1'); } catch (_) {}
        return list;
      }
      function persist() {
        try { localStorage.setItem(KEY, JSON.stringify(bills)); } catch (_) {}
      }
      if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
      function totals() { return bills.reduce((sum, item) => sum + safeAmount(item.amount), 0); }
      function grouped() {
        const map = new Map();
        for (const item of bills) {
          const value = safeAmount(item.amount);
          if (!value) continue;
          const name = item.name.trim() || 'ไม่ระบุรายการ';
          const color = item.color || randomColor(new Set([...map.values()].map(entry => entry.color)));
          const key = `${name}\u0000${color}`;
          const existing = map.get(key);
          map.set(key, { name, color, value: (existing?.value || 0) + value });
        }
        return [...map.values()].sort((a,b) => b.value-a.value);
      }
      function drawTable() {
        const rows = $('billRows');
        rows.replaceChildren();
        bills.forEach((item, index) => {
          const tr = document.createElement('tr');
          const nameCell = document.createElement('td');
          const nameWrap = document.createElement('div'); nameWrap.className = 'name-wrap';
          const pickerWrap = document.createElement('div'); pickerWrap.className = 'color-picker-wrap';
          const colorButton = document.createElement('button'); colorButton.className = 'color-button'; colorButton.type = 'button';
          colorButton.style.background = item.color; colorButton.setAttribute('aria-label', `เลือกสีรายการ ${item.name || index + 1}`);
          const tray = document.createElement('div'); tray.className = 'color-tray'; tray.hidden = true; tray.setAttribute('role', 'group'); tray.setAttribute('aria-label', 'เลือกสี');
          colors.forEach(color => {
            const swatch = document.createElement('button'); swatch.className = `swatch${color.toLowerCase() === item.color.toLowerCase() ? ' selected' : ''}`; swatch.type = 'button';
            swatch.style.background = color; swatch.setAttribute('aria-label', `ใช้สี ${color}`);
            swatch.addEventListener('click', () => { item.color = color; persist(); drawTable(); drawChart(); });
            tray.append(swatch);
          });
          colorButton.addEventListener('click', event => {
            event.stopPropagation();
            document.querySelectorAll('.color-tray').forEach(other => { if (other !== tray) other.hidden = true; });
            tray.hidden = !tray.hidden;
          });
          pickerWrap.append(colorButton, tray);
          const nameInput = document.createElement('input');
          nameInput.className = 'edit-field'; nameInput.type = 'text'; nameInput.value = item.name;
          nameInput.setAttribute('aria-label', `ชื่อรายการที่ ${index + 1}`);
          nameInput.autocomplete = 'off';
          nameInput.addEventListener('input', () => { item.name = nameInput.value; persist(); drawChart(); });
          nameWrap.append(pickerWrap, nameInput);
          const deleteButton = document.createElement('button'); deleteButton.className = 'delete-button'; deleteButton.type = 'button'; deleteButton.textContent = '×';
          deleteButton.title = `ลบรายการ ${item.name || index + 1}`; deleteButton.setAttribute('aria-label', deleteButton.title);
          deleteButton.addEventListener('click', () => { bills.splice(index, 1); persist(); drawTable(); drawChart(); });
          nameWrap.append(deleteButton); nameCell.append(nameWrap);
          const amountCell = document.createElement('td');
          const amountInput = document.createElement('input');
          amountInput.className = 'edit-field price'; amountInput.type = 'number'; amountInput.min = '0'; amountInput.step = '0.01';
          amountInput.inputMode = 'decimal'; amountInput.value = safeAmount(item.amount) || '';
          amountInput.setAttribute('aria-label', `ราคาของ ${item.name || `รายการที่ ${index + 1}`} เป็นบาท`);
          amountInput.addEventListener('input', () => { item.amount = safeAmount(amountInput.value); persist(); $('grandTotal').textContent = `฿${money(totals())}`; drawChart(); });
          amountCell.append(amountInput);
          tr.append(nameCell, amountCell);
          rows.append(tr);
        });
        $('grandTotal').textContent = `฿${money(totals())}`;
      }
      function pointOnCircle(cx, cy, r, angle) {
        return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
      }
      function donutPath(start, end, outer, inner) {
        const c = 160, large = end - start > Math.PI ? 1 : 0;
        const a = pointOnCircle(c,c,outer,start), b = pointOnCircle(c,c,outer,end);
        const d = pointOnCircle(c,c,inner,end), e = pointOnCircle(c,c,inner,start);
        return `M ${a.x} ${a.y} A ${outer} ${outer} 0 ${large} 1 ${b.x} ${b.y} L ${d.x} ${d.y} A ${inner} ${inner} 0 ${large} 0 ${e.x} ${e.y} Z`;
      }
      function drawChart() {
        const data = grouped();
        const sum = totals();
        const svg = $('donut');
        const legend = $('legend');
        svg.replaceChildren(); legend.replaceChildren();
        $('centerLabel').textContent = 'ยอดรวม';
        $('centerValue').textContent = `฿${money(sum)}`;
        if (!sum || !data.length) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
          circle.setAttribute('class','empty-chart'); circle.setAttribute('cx','160'); circle.setAttribute('cy','160'); circle.setAttribute('r','96'); svg.append(circle);
          return;
        }
        let angle = -Math.PI / 2;
        data.forEach((entry, i) => {
          const sweep = entry.value / sum * Math.PI * 2;
          const path = document.createElementNS('http://www.w3.org/2000/svg','path');
          const color = entry.color;
          path.setAttribute('d', donutPath(angle, angle + sweep, 120, 72));
          path.setAttribute('fill', color); path.setAttribute('stroke', '#fff'); path.setAttribute('stroke-width', '2');
          path.setAttribute('class', 'slice'); path.setAttribute('tabindex','0'); path.setAttribute('role','button');
          path.setAttribute('aria-label', `${entry.name}: ${money(entry.value)} บาท`);
          const show = () => { $('centerLabel').textContent = entry.name; $('centerValue').textContent = `฿${money(entry.value)}`; };
          const reset = () => { $('centerLabel').textContent = 'ยอดรวม'; $('centerValue').textContent = `฿${money(sum)}`; };
          path.addEventListener('mouseenter', show); path.addEventListener('focus', show);
          path.addEventListener('mouseleave', reset); path.addEventListener('blur', reset);
          path.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); show(); } });
          svg.append(path);
          const legendItem = document.createElement('div'); legendItem.className = 'legend-item';
          const dot = document.createElement('span'); dot.className = 'legend-dot'; dot.style.background = color;
          const name = document.createElement('span'); name.className = 'legend-name'; name.textContent = entry.name;
          const amount = document.createElement('span'); amount.className = 'legend-amount'; amount.textContent = `${money(entry.value)} ฿`;
          legendItem.append(dot, name, amount); legend.append(legendItem);
          angle += sweep;
        });
      }
      let previewUrl = '';
      let ocrWorkerPromise;
      function setOcrStatus(message, isError = false) {
        $('ocrStatus').textContent = message;
        $('ocrStatus').dataset.error = isError ? 'true' : 'false';
      }
      async function getTesseract() {
        if (window.Tesseract) return window.Tesseract;
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error('โหลดระบบอ่านข้อความไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง'));
          document.head.append(script);
        });
        return window.Tesseract;
      }
      async function getOcrWorker() {
        if (!ocrWorkerPromise) {
          ocrWorkerPromise = getTesseract().then(Tesseract => Tesseract.createWorker('tha+eng', 1, { logger: event => {
            if (event.status === 'recognizing text' && event.progress) setOcrStatus(`กำลังอ่านข้อความจากภาพ… ${Math.round(event.progress * 100)}%`);
            else if (event.status === 'loading language traineddata') setOcrStatus('กำลังเตรียมภาษาไทยสำหรับอ่านข้อความ…');
          }})).catch(error => { ocrWorkerPromise = null; throw error; });
        }
        return ocrWorkerPromise;
      }
      function extractReceipt(text) {
        const lines = text.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        let amount = '';
        const amountHeading = lines.findIndex(line => /จำนวนเงิน|ยอดเงิน|amount/i.test(line));
        if (amountHeading >= 0) {
          const nearby = lines.slice(amountHeading + 1, amountHeading + 5).join(' ');
          const match = nearby.match(/\b(\d[\d,]*\.\d{2})\b/);
          if (match) amount = match[1].replace(/,/g, '');
        }
        if (!amount) {
          const candidates = [...text.matchAll(/\b(\d{1,3}(?:,\d{3})*\.\d{2})\b/g)].map(match => match[1].replace(/,/g, '')).filter(value => Number(value) > 0);
          amount = candidates[0] || '';
        }
        let name = '';
        const memoIndex = lines.findIndex(line => /บันทึกช่วยจำ/.test(line));
        if (memoIndex >= 0) {
          name = lines[memoIndex].replace(/^.*?บันทึกช่วยจำ\s*[:：]?\s*/, '').trim();
          if (!name) name = lines.slice(memoIndex + 1).find(line => !/^(QR\s*Code|สแกน\s*QR)/i.test(line)) || '';
        }
        return { name: name.slice(0, 80), amount };
      }
      function releasePreview() {
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = '';
        $('receiptPreview').removeAttribute('src');
      }
      $('imageAddButton').addEventListener('click', () => $('receiptImage').click());
      $('receiptImage').addEventListener('change', async event => {
        const file = event.target.files?.[0];
        event.target.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')) { setOcrStatus('กรุณาเลือกไฟล์รูปภาพ', true); return; }
        releasePreview();
        previewUrl = URL.createObjectURL(file);
        $('receiptPreview').src = previewUrl;
        $('receiptName').value = '';
        $('receiptAmount').value = '';
        $('receiptDialog').showModal();
        setOcrStatus('กำลังเตรียมอ่านข้อความ…');
        try {
          const worker = await getOcrWorker();
          const { data } = await worker.recognize(file);
          const extracted = extractReceipt(data.text || '');
          $('receiptName').value = extracted.name;
          $('receiptAmount').value = extracted.amount;
          setOcrStatus(extracted.amount || extracted.name ? 'อ่านข้อความแล้ว ตรวจสอบหรือแก้ไขข้อมูลก่อนเพิ่มรายการ' : 'อ่านข้อความจากภาพไม่ชัด กรอกชื่อและยอดเงินด้วยตนเองได้');
        } catch (error) {
          setOcrStatus(`${error.message || 'อ่านข้อความจากภาพไม่สำเร็จ'} — กรอกข้อมูลเองแล้วเพิ่มรายการได้`, true);
        }
      });
      function closeReceiptDialog() {
        $('receiptDialog').close();
        releasePreview();
      }
      $('cancelReceipt').addEventListener('click', closeReceiptDialog);
      $('receiptDialog').addEventListener('click', event => { if (event.target === $('receiptDialog')) closeReceiptDialog(); });
      $('receiptDialog').addEventListener('close', releasePreview);
      $('receiptForm').addEventListener('submit', event => {
        event.preventDefault();
        const amountText = $('receiptAmount').value.trim();
        if (!amountText || !Number.isFinite(Number(amountText))) {
          setOcrStatus('กรอกยอดเงินให้ถูกต้องก่อนเพิ่มรายการ', true);
          $('receiptAmount').focus();
          return;
        }
        bills.push({ id: `bill-${Date.now()}-${Math.random().toString(16).slice(2)}`, name: $('receiptName').value.trim(), amount: safeAmount(amountText), color: randomColor(new Set(bills.map(item => item.color))) });
        persist(); drawTable(); drawChart(); closeReceiptDialog();
      });
      $('addButton').addEventListener('click', () => {
        bills.push({ id: `bill-${Date.now()}-${Math.random().toString(16).slice(2)}`, name: '', amount: 0, color: randomColor(new Set(bills.map(item => item.color))) });
        persist(); drawTable(); drawChart();
        const inputs = $('billRows').querySelectorAll('input');
        inputs[inputs.length - 2]?.focus();
      });
      $('pdfButton').addEventListener('click', () => window.print());
      drawTable(); drawChart(); persist();
    })();
  </script>
</body>
</html>
